name: Generate profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily, just after the snake
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/generate_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_cards.py

      - name: Collect output
        run: |
          mkdir -p dist
          cp assets/activity.svg assets/stats.svg dist/

      - name: Push cards
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
