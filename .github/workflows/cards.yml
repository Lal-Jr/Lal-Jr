name: Generate profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily, just after the snake
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/generate_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_cards.py

      - name: Push cards to the cards branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/cards
          cp assets/activity.svg assets/stats.svg /tmp/cards/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cards-build
          git rm -rf --cached . >/dev/null
          rm -rf assets scripts .github README.md LICENSE charts .gitignore || true
          cp /tmp/cards/activity.svg /tmp/cards/stats.svg .
          git add activity.svg stats.svg
          git commit -m "Update profile cards ($(date -u +%Y-%m-%d))"
          git push -f origin cards-build:cards
